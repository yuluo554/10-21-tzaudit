name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  layout:
    name: "layout + desensitization gates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "Sprint layout gate (methodology binding)"
        run: python tools/check-sprint-layout.py
      - name: "Desensitization gate (no host paths / usernames / local proxy)"
        run: python tools/check-desensitized.py

  tests:
    name: "pytest ${{ matrix.os }} py${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: "Install (editable + dev)"
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: "pytest"
        run: python -m pytest -q
      - name: "CLI smoke (help + version)"
        run: |
          python -m tzaudit --help
          python -m tzaudit --version
      - name: "Bench discipline: missing data must exit 3 (never a silent '0 项通过')"
        shell: bash
        run: |
          # GitHub 的 `shell: bash` 默认带 -e：必须先关掉，否则期望中的 rc=3 会直接把步骤判红。
          set +e
          set -o pipefail
          out="bench-out.txt"
          python bench/run.py --check > "$out" 2>&1
          rc=$?
          echo "rc=$rc"
          cat "$out"
          # CI 上没有 data/_downloads ⇒ 必须退 3，且逐条点名缺件、明写"不是 0 项通过"。
          test "$rc" -eq 3 || { echo "FAIL: 期望 rc=3，实得 $rc"; exit 1; }
          grep -q "缺件" "$out" || { echo "FAIL: 输出未点名缺件"; exit 1; }
          grep -q "不是" "$out" || { echo "FAIL: 输出未声明'不是 0 项通过'"; exit 1; }
          grep -q "0 项通过" "$out" || { echo "FAIL: 输出未提及'0 项通过'"; exit 1; }
          rm -f "$out"
