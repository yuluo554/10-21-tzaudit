name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  layout:
    name: "layout + desensitization gates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Sprint layout gate (methodology binding)"
        run: python tools/check-sprint-layout.py
      - name: "Desensitization gate (no host paths / usernames / local proxy)"
        run: python tools/check-desensitized.py

  tests:
    name: "pytest ${{ matrix.os }} py${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: "Install (editable + dev)"
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: "pytest"
        run: python -m pytest -q
      - name: "CLI smoke (help + version)"
        run: |
          python -m tzaudit --help
          python -m tzaudit --version
